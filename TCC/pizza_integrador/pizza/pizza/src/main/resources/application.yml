spring:
  application:
    name: aurora-pizza-os
  datasource:
    # A base v2 preserva qualquer arquivo legado `aurora.mv.db` importado de outra maquina.
    url: jdbc:h2:file:./data/aurora-v2;MODE=PostgreSQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8081
  error:
    include-message: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
aurora:
  security:
    jwt-secret: ${AURORA_JWT_SECRET:AuroraPizzaOS-2026-chave-local-segura-troque-em-producao}
    token-hours: 8
  demo-data: ${AURORA_DEMO_DATA:true}
