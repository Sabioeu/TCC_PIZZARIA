spring:
  application:
    name: aurora-pizza-os
  datasource:
    url: jdbc:h2:mem:aurora;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8081
  error:
    include-message: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
