services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: ${DATABASE_USERNAME:-aurora}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no arquivo .env}
    volumes:
      - aurora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-aurora} -d aurora"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./pizza_integrador/pizza/pizza
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://database:5432/aurora
      DATABASE_USERNAME: ${DATABASE_USERNAME:-aurora}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      AURORA_JWT_SECRET: ${AURORA_JWT_SECRET:?Defina AURORA_JWT_SECRET no arquivo .env}
      AURORA_DEMO_DATA: ${AURORA_DEMO_DATA:-false}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./pizza-front-end/frontend
      args:
        VITE_API_URL: /api
        VITE_WS_URL: /ws/orders
    restart: unless-stopped
    ports:
      - "${AURORA_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  aurora_postgres:
